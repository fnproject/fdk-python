[tox]
envlist = py{3.9,3.12},pep8-{3.9,3.12}
skipsdist = True

[testenv]
basepython =
    pep8-3.9: python3.9
    pep8-3.12: python3.12
    py3.9: python3.9
    py3.12: python3.12

passenv =
        DOCKER_HOST
        API_URL
setenv = VIRTUAL_ENV={envdir}
usedevelop = True
install_command = pip install -U {opts} {packages}
deps = -r{toxinidir}/test-requirements.txt
commands = find . -type f -name "*.pyc" -delete
whitelist_externals = find
                      rm
                      go
                      docker
[testenv:pep8-3.9]
commands = flake8 --extend-exclude=internal/tests-images/python3.12/runtime-specific-code-only-fn-test

[testenv:pep8-3.12]
commands = flake8

[testenv:venv]
commands = {posargs}

[testenv:py3.9]
commands = pytest -v -s --tb=long --cov=fdk {toxinidir}/fdk/tests

[testenv:py3.12]
commands = pytest -v -s --tb=long --cov=fdk {toxinidir}/fdk/tests

[flake8]
ignore = H405,H404,H403,H401,H306,H304,H101,E303,H301,W503
show-source = True
exclude=.venv,.git,.tox,dist,doc,*lib/python*,*egg,build,docs,venv,.venv
